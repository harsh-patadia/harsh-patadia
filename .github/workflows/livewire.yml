name: Live wire

# Rewrites the healthsucks.com section of README.md every morning
# (09:00 IST) with the site's latest posts. Also runnable on demand.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh the live wire section
        run: python3 scripts/livewire.py

      - name: Commit if anything changed
        run: |
          git config user.name "profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "📡 live wire sync"
          git push
