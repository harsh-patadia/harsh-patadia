name: Tic-Tac-Toe move

# A visitor "moves" by opening an issue titled `ttt|move|<CELL>` from a
# cell link in README.md. This workflow plays the move, lets the bot
# answer, re-renders the board in the README, then comments and closes.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Serialize games: one move at a time, in the order issues arrive.
concurrency:
  group: tictactoe
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'ttt|move|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Play the move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: python3 scripts/tictactoe.py

      - name: Commit the updated board
        run: |
          git config user.name "profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          git diff --cached --quiet || git commit -m "🎮 tic-tac-toe move by @${{ github.event.issue.user.login }}"
          git push

      - name: Report back and close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file game/comment.md
          gh issue close ${{ github.event.issue.number }}
